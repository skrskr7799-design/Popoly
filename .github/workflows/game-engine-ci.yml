name: Game Engine CI

on:
  push:
    branches:
      - docs/game-foundation
  pull_request:
    branches:
      - main

jobs:
  game-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: Lint
        run: npm run lint
      - name: TypeScript and production build
        run: npm run build
      - name: Game engine tests
        run: npm test
      - name: Build production Docker image
        run: docker build --pull=false -t popoly:ci .
      - name: Smoke-test production container
        run: |
          docker run --detach --name popoly-ci -p 127.0.0.1:3847:3000 popoly:ci
          trap 'docker stop popoly-ci >/dev/null 2>&1 || true' EXIT
          for attempt in $(seq 1 20); do
            if curl --fail --silent http://127.0.0.1:3847/ > /tmp/popoly.html; then
              break
            fi
            sleep 1
          done
          test -s /tmp/popoly.html
          grep -q '<div id="root"></div>' /tmp/popoly.html
          grep -q '/assets/.*\.js' /tmp/popoly.html
