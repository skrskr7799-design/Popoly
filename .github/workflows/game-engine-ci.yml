name: Game Engine CI

on:
  push:
    branches:
      - docs/game-foundation
  pull_request:
    branches:
      - main

jobs:
  game-engine:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-audit --no-fund
      - name: TypeScript and production build
        run: npm run build
      - name: Game engine tests
        run: npm test
